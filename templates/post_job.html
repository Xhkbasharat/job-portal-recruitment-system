
{% extends "base.html" %}

{% block title %}Post a Job - JobConnect{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-9">

        <div class="card shadow border-0 p-4">

            <div class="mb-4">
                <h2 class="fw-bold">Post a New Job</h2>
                <p class="text-muted">
                    Find the right candidate for your company.
                </p>
            </div>

            <form method="POST"
                  action="{{ url_for('recruiter.post_job') }}">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Job Title *</label>
                        <input type="text"
                               name="title"
                               class="form-control"
                               placeholder="e.g. Python Developer"
                               maxlength="150"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Company Name *</label>
                        <input type="text"
                               name="company"
                               class="form-control"
                               placeholder="Enter company name"
                               maxlength="150"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Job Location *</label>
                        <input type="text"
                               name="location"
                               class="form-control"
                               placeholder="e.g. Srinagar"
                               maxlength="150"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Employment Type *</label>

                        <select name="job_type"
                                class="form-select"
                                required>
                            <option value="">Select job type</option>
                            <option value="Full-time">Full-time</option>
                            <option value="Part-time">Part-time</option>
                            <option value="Internship">Internship</option>
                            <option value="Remote">Remote</option>
                            <option value="Contract">Contract</option>
                        </select>
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Salary</label>
                        <input type="text"
                               name="salary"
                               class="form-control"
                               placeholder="e.g. ₹25,000 - ₹40,000 per month">
                    </div>

                    <div class="col-12 mb-3">
                        <label class="form-label">Job Description *</label>
                        <textarea name="description"
                                  class="form-control"
                                  rows="6"
                                  placeholder="Describe the job responsibilities..."
                                  required></textarea>
                    </div>

                    <div class="col-12 mb-4">
                        <label class="form-label">Requirements</label>
                        <textarea name="requirements"
                                  class="form-control"
                                  rows="5"
                                  placeholder="Enter required skills, qualifications and experience..."></textarea>
                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary btn-lg">
                    Publish Job
                </button>

                <a href="{{ url_for('recruiter.dashboard') }}"
                   class="btn btn-outline-secondary btn-lg ms-2">
                    Cancel
                </a>

            </form>

        </div>

    </div>
</div>

{% endblock %}
